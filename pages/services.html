<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Student Services - CampusNest</title>
  <style>
    :root{--teal:#0b4f52;--line:#e2e6e7}
    *{box-sizing:border-box}
    body{margin:0;font-family:"Segoe UI",Arial,sans-serif}
    .topbar{height:66px;border-bottom:1px solid var(--line)}
    .inner{width:min(1160px,calc(100% - 32px));height:100%;margin:auto;display:flex;align-items:center}
    .brand{color:var(--teal);font-size:20px;font-weight:800;text-decoration:none;margin-right:32px}
    .inner nav{display:flex;gap:24px;font-size:12px;font-weight:700}
    .inner nav a{color:inherit;text-decoration:none}
    main{width:min(920px,calc(100% - 32px));margin:auto;padding:28px 0}
    .provider{border:1px solid var(--line);border-radius:8px;padding:20px;margin-bottom:24px}
    .provider-heading{display:flex;align-items:center;justify-content:space-between;gap:16px}
    .provider-heading h2{margin:0}
    .provider p,.service-card p{font-size:13px;line-height:1.55}
    .button{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:0;border-radius:6px;background:var(--teal);color:#fff;text-decoration:none;font-weight:800;white-space:nowrap}
    .catalog-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
    .service-card{border:1px solid var(--line);border-radius:7px;padding:14px}
    .service-card h3{margin:4px 0}
    .category,.muted{color:#687173;font-size:12px}
    .catalog-message{padding:10px;border-radius:6px;background:#fff8e8;color:#714d12;font-size:13px}
    .tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:20px}
    .tab{border:0;background:#fff;padding:12px 18px;border-bottom:3px solid transparent;font-weight:800}
    .tab.active{border-bottom-color:var(--teal)}
    form.request-form{display:none;border:1px solid var(--line);border-radius:8px;padding:20px}
    form.request-form.active{display:block}
    .field{margin-bottom:12px}
    .field label{display:block;margin-bottom:6px;font-size:12px;font-weight:700}
    .field input,.field textarea,.field select{width:100%;border:1px solid #ccd3d4;border-radius:6px;padding:10px}
    .field textarea{min-height:90px}
    button.submit{width:100%;height:42px;border:0;border-radius:6px;background:var(--teal);color:#fff;font-weight:800}
    .message{display:none;margin-bottom:12px;padding:10px;border-radius:6px;background:#edf7ef;color:#205b34}
    @media(max-width:760px){.inner nav{display:none}.catalog-grid{grid-template-columns:1fr}.provider-heading{align-items:flex-start;flex-direction:column}}
  </style>
  <style>
    @media(max-width:760px){.topbar{height:auto}.inner{height:auto;min-height:66px;flex-wrap:wrap;padding:8px 0}.brand{margin-right:12px}.inner nav{order:3;display:flex;flex:0 0 100%;width:100%;gap:18px;overflow-x:auto;padding:8px 0;white-space:nowrap}}
    @media(max-width:480px){.inner,main{width:calc(100% - 24px)}.provider{padding:16px}.tabs{overflow-x:auto}.tab{flex:0 0 auto;padding:12px}}
  </style>
  <link rel="stylesheet" href="../css/app-theme.css">
</head>
<body>
  <header class="topbar">
    <div class="inner">
      <a class="brand" href="../index.html"><img class="brand-logo" src="../assets/images/mouse-solution-logo.jpeg" alt="MOUSE Solution"></a>
      <nav><a href="rooms.html">Rooms</a><a href="jobs.html">Student Jobs</a><a href="services.html">Services</a></nav>
    </div>
  </header>
  <main>
    <h1>Student services</h1>
    <section id="astra-services" class="provider">
      <div class="provider-heading">
        <div><h2>ASTRA home services</h2><p>Browse the TechConnect service catalog. To place and track a booking, tenants sign in separately on ASTRA.</p></div>
        <a id="astra-open" class="button" href="http://localhost/ASTRA/" target="_blank" rel="noopener noreferrer">Open ASTRA to book</a>
      </div>
      <div id="catalog-message" class="catalog-message" role="status" aria-live="polite">Loading ASTRA services…</div>
      <div id="astra-catalog" class="catalog-grid"></div>
    </section>
    <h2>CampusNest requests</h2>
    <div class="tabs">
      <button class="tab active" data-target="repair" type="button">Repair request</button>
      <button class="tab" data-target="cleaning" type="button">Cleaning request</button>
    </div>
    <form id="repair" class="request-form active">
      <div class="message"></div>
      <div class="field"><label>Property ID</label><input name="listing_id" type="number" required></div>
      <div class="field"><label>Problem category</label><select name="category" required><option value="">Choose category</option><option>Plumbing</option><option>Electrical</option><option>Furniture</option><option>Other</option></select></div>
      <div class="field"><label>Problem description</label><textarea name="description" required></textarea></div>
      <div class="field"><label>Photo URL (optional)</label><input name="photo_url" type="url"></div>
      <button class="submit" type="submit">Submit repair request</button>
    </form>
    <form id="cleaning" class="request-form">
      <div class="message"></div>
      <div class="field"><label>Location</label><input name="location" required></div>
      <div class="field"><label>Preferred date</label><input name="preferred_date" type="date" required></div>
      <div class="field"><label>Service type</label><select name="service_type" required><option>One-time cleaning</option><option>Deep cleaning</option><option>Moving cleaning</option></select></div>
      <div class="field"><label>Notes</label><textarea name="notes"></textarea></div>
      <button class="submit" type="submit">Request cleaning</button>
    </form>
  </main>
  <script>
    function safeHttpUrl(value) {
      try {
        const url = new URL(value);
        return ["http:", "https:"].includes(url.protocol) ? url.href : null;
      } catch {
        return null;
      }
    }

    async function loadAstraCatalog() {
      const message = document.querySelector("#catalog-message");
      const catalog = document.querySelector("#astra-catalog");
      try {
        const response = await fetch("../php/astra.php?resource=catalog");
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "ASTRA services could not be loaded.");
        if (!Array.isArray(data.items)) throw new Error("ASTRA returned an invalid service catalog.");
        const portalUrl = safeHttpUrl(data.portal_url);
        if (portalUrl) document.querySelector("#astra-open").href = portalUrl;
        message.textContent = data.notice || "Service descriptions are provided by ASTRA.";
        catalog.replaceChildren();
        if (!data.items.length) {
          message.textContent = "ASTRA has no published services at the moment.";
          return;
        }
        data.items.forEach(item => {
          const card = document.createElement("article");
          card.className = "service-card";
          const category = document.createElement("div");
          category.className = "category";
          category.textContent = item.category || "Home service";
          const title = document.createElement("h3");
          title.textContent = item.name_en || item.name_fr || "Service";
          const description = document.createElement("p");
          description.textContent = item.description || "";
          card.append(category, title, description);
          catalog.append(card);
        });
      } catch (error) {
        message.textContent = `${error.message} You can still open ASTRA to check availability.`;
      }
    }

    document.querySelectorAll(".tab").forEach(button => button.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
      document.querySelectorAll(".request-form").forEach(form => form.classList.remove("active"));
      button.classList.add("active");
      document.querySelector(`#${button.dataset.target}`).classList.add("active");
    }));

    document.querySelectorAll(".request-form").forEach(form => form.addEventListener("submit", async event => {
      event.preventDefault();
      const data = new FormData(form);
      data.set("action", form.id);
      const response = await fetch("../php/services.php", { method: "POST", body: data });
      const result = await response.json();
      const message = form.querySelector(".message");
      message.style.display = "block";
      message.textContent = result.success ? "Request submitted successfully." : (result.error || "Unable to submit request.");
      if (result.success) form.reset();
    }));

    loadAstraCatalog();
  </script>
<script src="../javascript/app-i18n.js"></script>
</body>
</html>
