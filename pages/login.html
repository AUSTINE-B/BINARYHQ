<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - CampusNest</title>
  <style>
    :root { --teal:#0b4f52; --ink:#1d2223; --line:#dde2e3; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#f7f8f8; font-family:"Segoe UI",Arial,sans-serif; }
    .topbar { height:66px; background:#fff; border-bottom:1px solid #edf0f0; }
    .topbar-inner { width:min(1160px,calc(100% - 64px)); height:100%; margin:auto; display:flex; align-items:center; }
    .brand { color:var(--teal); font-size:20px; font-weight:800; text-decoration:none; margin-right:32px; }
    nav { display:flex; gap:28px; font-size:12px; font-weight:700; }
    nav a,.top-actions a { color:inherit; text-decoration:none; }
    .top-actions { margin-left:auto; display:flex; align-items:center; gap:14px; }
    .language { min-width:56px; height:30px; display:grid; place-items:center; border-radius:5px; background:#f1f3f4; font-size:10px; }
    .signup { height:46px; display:grid; place-items:center; border-radius:6px; padding:0 19px; color:#fff!important; background:var(--teal); }
    main { min-height:calc(100vh - 66px); display:grid; place-items:start center; padding-top:56px; }
    .login-card { width:min(420px,calc(100% - 32px)); border:1px solid var(--line); border-radius:8px; background:#fff; padding:24px; }
    h1 { margin:0 0 20px; text-align:center; }
    label { display:block; margin:12px 0 6px; font-size:12px; font-weight:700; }
    input { width:100%; height:42px; border:1.5px solid #cfd4d5; border-radius:6px; padding:0 12px; }
    button { width:100%; height:42px; margin-top:18px; border:0; border-radius:6px; color:#fff; background:var(--teal); font-weight:800; }
    .signup-link { display:block; margin-top:14px; text-align:center; color:#0d5d61; font-size:12px; }
  </style>
  <style>
    @media(max-width:760px){
      .topbar{height:auto}
      .topbar-inner{width:calc(100% - 32px);height:auto;min-height:66px;flex-wrap:wrap;padding:8px 0}
      .brand{margin-right:0}
      nav{order:3;flex:0 0 100%;width:100%;gap:18px;overflow-x:auto;padding:8px 0;white-space:nowrap}
      .top-actions{gap:8px}
      .language{display:none}
      main{min-height:calc(100vh - 66px);padding:28px 16px}
      .login-card{width:min(420px,100%);padding:20px}
    }
    @media(max-width:390px){.topbar-inner{width:calc(100% - 24px)}.signup{height:40px;padding:0 12px}.top-actions{gap:10px}}
  </style>
    <link rel="stylesheet" href="../css/app-theme.css">
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><a class="brand" href="../index.html"><img class="brand-logo" src="../assets/images/mouse-solution-logo.jpeg" alt="MOUSE Solution"></a><nav><a href="../index.html#rooms">Rooms</a><a href="../index.html#map">Map</a><a href="../index.html#jobs">Student Jobs</a><a href="../index.html#repairs">Repairs</a><a href="../index.html#cleaning">Cleaning</a></nav><div class="top-actions"><a class="language" href="translator.html">EN / FR</a><a href="login.html">Log in</a><a class="signup" href="signup.html">Sign up</a></div></div></header>
  <main><form class="login-card" action="../php/login.php" method="post"><h1>Log in</h1><label for="email">Email</label><input id="email" name="email" type="email" required><label for="password">Password</label><input id="password" name="password" type="password" required><button type="submit">Log in</button><a class="signup-link" href="reset-password.html">Forgot password?</a><a class="signup-link" href="signup.html">Create an account</a></form></main>
<script src="../javascript/app-i18n.js"></script>
</body>
</html>
