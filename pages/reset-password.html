<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset password - CampusNest</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f8f8; font-family: "Segoe UI",Arial,sans-serif; }
    .topbar { height: 66px; background: #fff; border-bottom: 1px solid #e2e6e7; }

    main { min-height: calc(100vh - 66px); display: grid; place-items: start center; padding: 56px 16px 24px; }
    form { width: min(420px,100%); border: 1px solid #dde2e3; border-radius: 8px; background: #fff; padding: 24px; }
    h1 { text-align: center; }
    label { display: block; margin: 12px 0 6px; font-size: 12px; font-weight: 700; }
    input { width: 100%; height: 42px; border: 1px solid #ccd3d4; border-radius: 6px; padding: 0 12px; }
    button { width: 100%; height: 42px; margin-top: 16px; border: 0; border-radius: 6px; background: #0b4f52; color: #fff; font-weight: 800; }
    .back { display: block; margin-top: 14px; text-align: center; color: #0d5d61; font-size: 12px; }

    <link rel="stylesheet" href="../css/app-theme.css">

    <form action="../php/reset_password.php" method="post">
      <h1>Reset password</h1>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
      <button type="submit">Request reset</button>
      <a class="back" href="login.html">Back to log in</a>
    </form>
  </main>
<script src="../javascript/app-i18n.js"></script>
